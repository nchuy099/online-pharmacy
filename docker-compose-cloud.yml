services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: smart-pharma-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - smart-pharma-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: smart-pharma-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=smart_pharma
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smart-pharma-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: smart-pharma-redis
    ports:
      - "6379:6379"
    networks:
      - smart-pharma-network
    restart: unless-stopped

  backend:
    image: ${DOCKER_USERNAME}/smart-pharma-backend:latest
    container_name: smart-pharma-backend
    env_file:
      - ./backend/.env.cloud
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=cloud
    networks:
      - smart-pharma-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  chatbot-ai:
    image: ${DOCKER_USERNAME}/smart-pharma-chatbot-ai:latest
    container_name: smart-pharma-chatbot-ai
    env_file:
      - ./chatbot-ai/.env.cloud
    ports:
      - "8001:8001"
    networks:
      - smart-pharma-network
    depends_on:
      - qdrant
    restart: unless-stopped

  rcm-service:
    image: ${DOCKER_USERNAME}/smart-pharma-rcm-service:latest
    container_name: smart-pharma-rcm-service
    env_file:
      - ./rcm-service/.env.cloud
    ports:
      - "8002:8002"
    networks:
      - smart-pharma-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

networks:
  smart-pharma-network:
    driver: bridge

volumes:
  qdrant_data:
  postgres_data: