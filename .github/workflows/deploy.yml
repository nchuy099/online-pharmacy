name: Deploy Backend Services

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run backend unit tests and coverage gate
        working-directory: ./backend
        run: ./gradlew clean test jacocoTestReport jacocoTestCoverageVerification

      - name: Upload backend test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: backend/build/reports/jacoco/test/html

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build backend image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/smart-pharma-backend:latest ./backend

      - name: Build chatbot-ai image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/smart-pharma-chatbot-ai:latest ./chatbot-ai

      - name: Build rcm-service image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/smart-pharma-rcm-service:latest ./rcm-service

      - name: Push backend image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/smart-pharma-backend:latest

      - name: Push chatbot-ai image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/smart-pharma-chatbot-ai:latest

      - name: Push rcm-service image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/smart-pharma-rcm-service:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/online-pharmacy-deploy
            docker compose -f docker-compose-cloud.yml pull
            docker compose -f docker-compose-cloud.yml up -d
            docker image prune -f
