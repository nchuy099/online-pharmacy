services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: smart-pharma-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - smart-pharma-network

  postgres:
    image: postgres:15-alpine
    container_name: smart-pharma-postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=smart_pharma
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smart-pharma-network
    
  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.local
    container_name: smart-pharma-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=local
    networks:
      - smart-pharma-network
    depends_on:
      postgres:
        condition: service_healthy
  # AI Services
  chatbot-ai:
    build:
      context: ./chatbot-ai
      dockerfile: Dockerfile
    container_name: smart-pharma-chatbot
    env_file:
      - ./chatbot-ai/.env.local
    ports:
      - "8001:8001"
    networks:
      - smart-pharma-network
    depends_on:
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy

  rcm-service:
    build:
      context: ./rcm-service
      dockerfile: Dockerfile
    container_name: smart-pharma-rcm
    env_file:
      - ./rcm-service/.env.local
    ports:
      - "8002:8002"
    networks:
      - smart-pharma-network
    depends_on:
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy

  # Frontend Services
  frontend-customer:
    build:
      context: ./frontend-customer
      dockerfile: Dockerfile
    container_name: smart-pharma-fe-customer
    ports:
      - "3000:80"
    depends_on:
      - backend
      - chatbot-ai
      - rcm-service
    networks:
      - smart-pharma-network

  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    container_name: smart-pharma-fe-admin
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - smart-pharma-network

  frontend-pharmacist:
    build:
      context: ./frontend-pharmacist
      dockerfile: Dockerfile
    container_name: smart-pharma-fe-pharmacist
    ports:
      - "3002:80"
    depends_on:
      - backend
    networks:
      - smart-pharma-network

networks:
  smart-pharma-network:
    driver: bridge

volumes:
  qdrant_data:
  postgres_data:
