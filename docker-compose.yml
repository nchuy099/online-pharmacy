services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: smart-pharma-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - smart-pharma-network

  postgres:
    image: postgres:15-alpine
    container_name: smart-pharma-postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=smart_pharma
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smart-pharma-network

  redis:
    image: redis:7-alpine
    container_name: smart-pharma-redis
    ports:
      - "6380:6379"
    networks:
      - smart-pharma-network

  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.local
    container_name: smart-pharma-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=local
    networks:
      - smart-pharma-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
  # AI Services
  chatbot-ai:
    build:
      context: ./chatbot-ai
      dockerfile: Dockerfile
    container_name: smart-pharma-chatbot
    env_file:
      - ./chatbot-ai/.env.local
    ports:
      - "8001:8001"
    networks:
      - smart-pharma-network
    depends_on:
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy

  rcm-service:
    build:
      context: ./rcm-service
      dockerfile: Dockerfile
    container_name: smart-pharma-rcm
    env_file:
      - ./rcm-service/.env.local
    ports:
      - "8002:8002"
    networks:
      - smart-pharma-network
    depends_on:
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy

networks:
  smart-pharma-network:
    driver: bridge

volumes:
  qdrant_data:
  postgres_data:
